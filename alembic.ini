# Alembic configuration for RuleShift.
#
# The database URL is NOT stored here. It is read from the central config
# layer (core/config.py), which resolves DATABASE_URL from the environment
# or a local .env file, defaulting to sqlite:///./ruleshift.db.
#
# Common commands:
#   alembic upgrade head     apply all pending migrations
#   alembic downgrade base   roll back everything (careful!)
#   alembic revision --autogenerate -m "message"

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S